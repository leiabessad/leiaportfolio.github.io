<script>
const board = document.getElementById('board');
const nodesWrap = document.getElementById('nodes');
const nodeWidth = 260;
const stepY = 150;
const offsetX = 140;
let path = [];

function createNode(text, x, y, withButtons = true){
  const el = document.createElement('div');
  el.className = 'node';

  if (withButtons) el.style.width = nodeWidth + 'px';

  el.style.left = x + 'px';
  el.style.top = y + 'px';

  const q = document.createElement('div');
  q.className = 'q';

  if (withButtons) {
    q.textContent = text;
  } else {
    q.innerHTML = text;
  }

  el.appendChild(q);

  if(withButtons){
    const btns = document.createElement('div');
    btns.className = 'btns';

    ["oui","non"].forEach(val=>{
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = val.toUpperCase();
      b.onclick = () => answer(el,val);
      btns.appendChild(b);
    });

    el.appendChild(btns);
  }

  nodesWrap.appendChild(el);
  return el;
}


function answer(node, answer){
  path.push(answer);

  const startX = parseFloat(node.style.left);
  const startY = parseFloat(node.style.top);
  const nextY = startY + stepY;
  const nextX = answer === "oui" ? startX - offsetX : startX + offsetX;

  // 1️⃣ désactiver tous les boutons
  node.querySelectorAll("button").forEach(b => b.disabled = true);

  // 2️⃣ ajouter la classe "selected" au bouton cliqué
  const clickedBtn = Array.from(node.querySelectorAll("button")).find(b => b.textContent.toLowerCase() === answer);
  if (clickedBtn) clickedBtn.classList.add("selected");

  let text = "";
  let final = false;

 

  if(path.length===1){ 
  text = 'AVEZ-VOUS ENVIE DE FAIRE DES TRUCS COOLS ?'; 
}

if(path.length===2){ 
  text = 'AIMERIEZ-VOUS GAGNER DES PRIX AU PASSAGE ?'; 
}

if(path.length === 3){
  final = true;
  const [q1, q2, q3] = path;
  const mail = '<a href="mailto:leia.bessad@gmail.com" class="mail-link">leia.bessad@gmail.com</a>';

  if(q1 === 'oui' && q2 === 'oui' && q3 === 'oui') 
    text = `PARFAIT. ON EST FAITS POUR S’ENTENDRE.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'oui' && q2 === 'oui' && q3 === 'non') 
    text = `ON PEUT FAIRE DES CHOSES TRÈS BIEN, MÊME SANS TROPHÉE.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'oui' && q2 === 'non' && q3 === 'oui') 
    text = `TRÈS BON PROGRAMME : DES IDÉES FORTES ET DES TRUCS COOLS.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'oui' && q2 === 'non' && q3 === 'non') 
    text = `PAS GRAVE, ON PEUT COMMENCER PAR FAIRE QUELQUE CHOSE DE BIEN.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'non' && q2 === 'oui' && q3 === 'oui') 
    text = `ALORS IL VOUS FAUT PEUT-ÊTRE QUELQU’UN POUR METTRE TOUT ÇA EN FORME.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'non' && q2 === 'oui' && q3 === 'non') 
    text = `ON DIRAIT QUE JE PEUX VOUS ÊTRE UTILE PLUS VITE QUE PRÉVU.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'non' && q2 === 'non' && q3 === 'oui') 
    text = `IL Y A QUAND MÊME MATIÈRE À FAIRE QUELQUE CHOSE D’INTÉRESSANT.<br>ÉCRIVEZ-MOI : ${mail}`;

  if(q1 === 'non' && q2 === 'non' && q3 === 'non') 
    text = `BON. IL EST PEUT-ÊTRE TEMPS D’AJOUTER UN PEU DE CRÉA LÀ-DEDANS.<br>ÉCRIVEZ-MOI : ${mail}`;
}


  createNode(text,nextX,nextY,!final);

  if(final){
    const r = document.createElement('button');
    r.className='restart';
    r.textContent='RECOMMENCER';
    r.style.top = nextY+120+'px';
    r.onclick=restart;
    nodesWrap.appendChild(r);
  }
}

function restart(){
  nodesWrap.innerHTML='';
  path=[];
  start();
}

function start(){
  const rect = board.getBoundingClientRect();
  createNode('AVEZ-VOUS BESOIN D’UN CRÉATIF ?',rect.width/2-nodeWidth/2,20);
}

start();

  /* Mobile menu open/close (safely: only add listeners if elements existent) */
if (hamburger && sidebar && overlay) {
        hamburger.addEventListener('click', () => {
          sidebar.classList.add('active');
          overlay.classList.add('active');
        });
      }

      const closeMenu = () => {
        if (sidebar) sidebar.classList.remove('active');
        if (overlay) overlay.classList.remove('active');
      };

      if (overlay) overlay.addEventListener('click', closeMenu);
      if (closeBtn) closeBtn.addEventListener('click', closeMenu);

      /* Lightbox setup (graceful: only if lightbox elements exist) */
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');
      const prevArrow = document.getElementById('prevArrow');
      const nextArrow = document.getElementById('nextArrow');
</script>
